name: Android CI/CD - Build, Sign & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Type of version bump (default: patch)'
        type: choice
        options: ['patch', 'minor', 'major']
        default: 'patch'
      specific_version:
        description: 'Set a specific version (e.g., 26.0.0). Overrides bump_type.'
        type: string
        required: false
      specific_version_code:
        description: 'Set a specific version code (e.g., 42). Overrides automatic increment.'
        type: string
        required: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Sign & Release to Play Store
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 3. Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Uses vamsi-alluri/android-version-actions
      # The action logic automatically prioritizes 'specific_version' if provided;
      # otherwise, it falls back to 'SemanticVersioningOptionToIncrement'.
      - name: 4. Bump Android Version
        uses: vamsi-alluri/android-version-actions@v0.1.1
        with:
          gradlePath: app/build.gradle
          versionCode: ${{ github.event.inputs.specific_version_code }}
          # Always increment the internal version code
          versionCodeIncrementBy: 1
          # If specific_version input is set, this takes priority
          versionName: ${{ github.event.inputs.specific_version }}
          # If specific_version is empty, this handles the patch/minor/major bump
          SemanticVersioningOptionToIncrement: ${{ (github.event_name == 'workflow_dispatch') && github.event.inputs.bump_type || 'patch' }}

      - name: 5. Inject API Key into local.properties
        run: |
          echo "API_KEY=${{ secrets.API_KEY }}" > ./local.properties
        
      - name: 6. Decode and setup Keystore
        run: |
          echo "${{ secrets.SIGNING_KEY_STORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/app/release-keystore.jks

      - name: 7. Build and Sign App Bundle
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: 8. Upload to Internal Testing Track on Google Play
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.app.bmeapplication1
          track: internal
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          
      - name: 9. Commit and Push Version Bump
        run: |
          # Read the new version name directly from the file
          NEW_VERSION_NAME=$(grep "versionName " app/build.gradle | awk '{print $2}' | tr -d '"')
          
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add app/build.gradle
          
          # [skip ci] prevents this commit from triggering the workflow again
          git commit -m "ci: Bump version to $NEW_VERSION_NAME [skip ci]"
          
          git push