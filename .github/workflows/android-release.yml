name: Android CI/CD - Build, Sign & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Type of version bump (default: patch)'
        type: choice
        options: ['patch', 'minor', 'major']
        default: 'patch'
      specific_version:
        description: 'Set a specific version (e.g., 26.0.0). Overrides bump_type.'
        type: string
        required: false
      specific_version_code:
        description: 'Set a specific version code (e.g., 42). Overrides automatic increment.'
        type: string
        required: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Sign & Release to Play Store
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.STREETCARE_ANDROID_DEPLOY_KEY }}
          fetch-depth: 0

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Uses vamsi-alluri/android-version-actions
      # The action logic automatically prioritizes 'specific_version' if provided;
      # otherwise, it falls back to 'SemanticVersioningOptionToIncrement'.
      - name: 4. Bump Android Version
        uses: vamsi-alluri/android-version-actions@v0.1.1
        with:
          gradlePath: app/build.gradle
          versionCode: ${{ github.event.inputs.specific_version_code }}
          # Always increment the internal version code
          versionCodeIncrementBy: 1
          # If specific_version input is set, this takes priority
          versionName: ${{ github.event.inputs.specific_version }}
          # If specific_version is empty, this handles the patch/minor/major bump
          SemanticVersioningOptionToIncrement: ${{ (github.event_name == 'workflow_dispatch') && github.event.inputs.bump_type || 'patch' }}

      - name: 5. Write google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: 5b. Debug - Verify google-services.json SHA-1 entries
        run: |
          cat app/google-services.json | python3 -c "
          import json,sys
          data=json.load(sys.stdin)
          for client in data['client']:
              pkg=client['client_info']['android_client_info']['package_name']
              for oc in client.get('oauth_client',[]):
                  if oc.get('client_type')==1:
                      print(f'{pkg}: {oc[\"android_info\"][\"certificate_hash\"]}')

      - name: 6. Inject Configuration into local.properties
        run: |
          echo "API_KEY=${{ secrets.API_KEY }}" > ./local.properties
          echo "API_KEY_PLACES=${{ secrets.API_KEY_PLACES }}" >> ./local.properties
          echo "INTERACTION_LOG_COLLECTION=${{ secrets.INTERACTION_LOG_COLLECTION }}" >> ./local.properties
          echo "HELP_REQUEST_COLLECTION=${{ secrets.HELP_REQUEST_COLLECTION }}" >> ./local.properties
        
      - name: 7. Decode and setup Keystore
        run: |
          echo "${{ secrets.SIGNING_KEY_STORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/app/release-keystore.jks

      - name: 8. Build and Sign App Bundle
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: 9. Upload to Internal Testing Track on Google Play
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.app.bmeapplication1
          track: internal
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          
      - name: 10. Commit and Push Version Bump
        run: |
          NEW_VERSION_NAME=$(grep "versionName " app/build.gradle | awk '{print $2}' | tr -d '"')
          TRIGGER_MSG=$(git log -1 --pretty=%s HEAD | awk '{ if (length($0) > 40) print substr($0, 1, 40) "..."; else print $0 }')

          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add app/build.gradle

          git commit -m "Released: $TRIGGER_MSG with app version $NEW_VERSION_NAME [skip ci]"

          git push
