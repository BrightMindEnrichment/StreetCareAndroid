# .github/workflows/android-release.yml

name: Android CI/CD - Build, Sign & Release

on:
  # Triggers the workflow on push events but only for the main branch
  push:
    branches: [ main ]
    
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build, Sign & Release to Play Store
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 3. Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: 4. Inject API Key into local.properties
        # This creates a local.properties file that your build.gradle can read.
        # This is the standard and safest way to handle API keys.
        run: |
          echo "API_KEY=${{ secrets.API_KEY }}" > ./local.properties
        
      - name: 5. Decode and setup Keystore
        # Decodes the base64 encoded keystore file from secrets and places it in the app module's directory
        run: |
          echo "${{ secrets.SIGNING_KEY_STORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/app/release-keystore.jks

      - name: 6. Build and Sign App Bundle
        # The signing properties are passed as environment variables, which are read by build.gradle
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: 7. Upload to Internal Testing Track on Google Play
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          # The JSON key for your Google Play service account
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          
          # Your app's package name
          packageName: com.app.bmeapplication1
          
          # The track to upload to (e.g., internal, alpha, beta, production)
          track: internal
          
          # Path to the AAB file to upload
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
                    
          # Optional: Path to a directory with release notes
          # whatsNewDirectory: app/src/main/play/release-notes/
